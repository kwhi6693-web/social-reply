name: Finalize verified stable release
on:
  push:
    branches: [release-v2.0.2]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/"$GITHUB_REPOSITORY"/releases/431573239 > existing-draft.json
          gh api repos/"$GITHUB_REPOSITORY"/actions/runs/41463876475 > source-ci.json
          python3 -B - <<'PY'
          import json
          r=json.load(open('existing-draft.json'))
          expected=json.loads("{\"social-reply-v2.0.2.zip\":{\"size\":88342,\"digest\":\"sha256:d665a73a4d30482222abff5ea870998a6c07b66da07000a77cea8a2beeca248d\"},\"manifest.json\":{\"size\":5264,\"digest\":\"sha256:2bff78d9f2f94d4c145f05d915b37e651c11238dc2f59a00ac42c1b2a7f5800d\"},\"SHA256SUMS.txt\":{\"size\":90,\"digest\":\"sha256:2ce00eb08c3f0a7df952f256ad697ff8a6ed3925e3dd660e9708e83e5e56f10d\"}}")
          assert r['tag_name']=='v2.0.2' and r['draft'] and not r['prerelease']
          assert r['name']=='Social Reply v2.0.2'
          assert r['target_commitish']=='6966d9f42e5351644ca40189a3837fa0cc5a2fec'
          assert len(r['assets'])==3
          for a in r['assets']:
              e=expected[a['name']]
              assert a['state']=='uploaded' and a['size']==e['size'] and a['digest']==e['digest']
          assert r['body']=="# Social Reply v2.0.2\n\nOne natural reply, grounded in what you actually mean.\n\nSocial Reply is a lightweight Agent Skill for personal conversations. It combines the current context, your intent, compact profiles, and relevant communication guidance to produce one ready-to-send reply by default.\n\n## Highlights\n\n- One final reply by default, with analysis available when requested.\n- Separate private profiles, source evidence, and memory management.\n- Per-turn, per-person, global, and long-term expression preferences.\n- 32 core communication methods and optional reviewed experience extensions.\n- Separate fast, standard, and deep processing paths.\n- English, Simplified Chinese, and Traditional Chinese READMEs with matching navigation and badges.\n- No private profiles, real chat records, original videos, credentials, or machine-specific paths in the installer.\n\n## Install\n\nDownload **social-reply-v2.0.2.zip** and **SHA256SUMS.txt** from the release assets. Verify the checksum, then install the complete `social-reply/` folder using your host's supported Skill installation flow. Do not substitute GitHub's automatically generated source archive for the verified installer.\n\n- Installer size: **88,342 bytes**\n- Files: **32**\n- SHA-256: `d665a73a4d30482222abff5ea870998a6c07b66da07000a77cea8a2beeca248d`\n- Persistence tools: **Python 3.10+**, standard library only, and authorized private storage.\n- Reply generation: a host model supporting Agent Skills; screenshots additionally require vision.\n\n## Validation and scope\n\nThe source passed the repository's Python 3.10 and 3.13 CI. Publication rebuilds the package from the pinned source commit and verifies every file and the complete ZIP checksum before uploading. Existing local and real-host anonymous evidence is documented in the README; software tests are not equivalent to model-response quality tests.\n\nThis is the stable v2.0.2 distribution. The stable designation does not expand the measured validation scope: independent clean-host first installation, complete version binding for automatic loading, actual model token usage and generation timing, long-term cross-device persistence, and other operating systems remain unverified.\n\nThis release updates distribution documentation and includes the three localized READMEs. Core runtime behavior is unchanged. The earlier **v2.0.2-rc.1** release and its original assets are preserved.\n\n## Privacy and license\n\nKeep personal data outside the installation directory. Public project commits use GitHub no-reply addresses. User content and third-party source materials retain their own rights; code and original documentation are licensed under MIT.\n"
          c=json.load(open('source-ci.json'))
          assert c['head_sha']=='6966d9f42e5351644ca40189a3837fa0cc5a2fec' and c['status']=='completed' and c['conclusion']=='success'
          print('Verified existing draft, three exact attachments, English notes and source CI.')
          PY
          gh api --method PATCH repos/"$GITHUB_REPOSITORY"/releases/431573239 -F draft=false -F prerelease=false -f make_latest=true --jq '{tag: .tag_name, draft: .draft, prerelease: .prerelease, url: .html_url}'
